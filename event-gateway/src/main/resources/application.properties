spring.application.name=event-gateway
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Circuit Breaker
resilience4j.circuitbreaker.instances.accountService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.accountService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=4
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Count connectivity and server errors as failures.
# Do not count ordinary client-side 4xx responses as service failures.
resilience4j.circuitbreaker.instances.accountService.recordExceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException