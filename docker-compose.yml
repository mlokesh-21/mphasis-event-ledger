
services:
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: "jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - event-ledger-network
    restart: unless-stopped

  event-gateway:
    build:
      context: .
      dockerfile: event-gateway/Dockerfile
    container_name: event-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: "jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      ACCOUNT_SERVICE_URL: "http://account-service:8081"
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - event-ledger-network
    restart: unless-stopped

networks:
  event-ledger-network:
    driver: bridge
